[global]
# Listen on ports 80, 443, and 3923
p: 80, 443, 3923
# Enable file indexer for searching and upload-undo
e2dsa
# Enable music metadata indexing
e2ts

[accounts]
# Define user accounts and passwords/hashes
user1: passwordhash1
user2: passwordhash2

# Define a volume (share) at the root path (/)
[/]
# Make the current directory available
.:/
# Anyone can read (r:*), but user1 and user2 have read-write-modify-delete access
r: *
rwmd: user1, user2

# Define another volume at /music, mapped to a specific path
[/music]
/home/user/Music
r: *
# Only user2 can write here
w: user2
